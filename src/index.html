<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kiruna Live Bus Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/trip.css" />
  <link rel="icon" href="data:," />
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <script src="runtime-config.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="header-title">
      <h1>Kiruna buses</h1>
      <p>Live map and departures</p>
      <div class="header-updates">
        <span id="refresh-countdown" class="refresh-countdown" role="timer" aria-live="off"></span>
        <div class="header-notices" role="group" aria-label="Update notices (scroll for more)" tabindex="0">
          <span id="app-error" class="header-notice" role="alert" hidden></span>
          <span id="status-banner" class="header-notice" role="status" aria-live="polite" hidden></span>
        </div>
      </div>
      <button id="theme-toggle" class="theme-toggle" type="button">Dark</button>
    </div>
  </header>

  <main class="app-layout">
    <section class="map-panel" aria-label="Live bus map">
      <div id="map"></div>
      <div id="map-controls" class="map-controls">
        <div class="map-toolbar" role="group" aria-label="Map tools">
          <button id="map-lines-toggle" class="map-tool-button" type="button" aria-expanded="false" aria-controls="map-lines-panel">
            Lines <span id="lines-button-summary" class="map-tool-count"></span>
          </button>
          <button id="map-stops-toggle" class="map-tool-button" type="button" aria-expanded="false" aria-controls="map-stops-panel">
            Find a stop
          </button>
        </div>
        <section id="map-lines-panel" class="map-tool-panel" aria-labelledby="lines-heading" hidden>
          <div class="map-tool-heading">
            <h2 id="lines-heading">Lines</h2>
            <button class="map-tool-close" type="button" data-close-map-panel aria-label="Close line filters">&times;</button>
          </div>
          <p id="lines-summary" class="hint">Loading lines</p>
          <div id="line-filters" class="line-filters"></div>
        </section>
        <section id="map-stops-panel" class="map-tool-panel" aria-labelledby="stop-heading" hidden>
          <div class="map-tool-heading">
            <h2 id="stop-heading">Find a stop</h2>
            <button class="map-tool-close" type="button" data-close-map-panel aria-label="Close stop finder">&times;</button>
          </div>
          <label class="visually-hidden" for="stop-search">Search for a bus stop</label>
          <div class="stop-search-wrap">
            <div class="stop-search">
              <input id="stop-search" type="text" placeholder="Stop name or number" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="stop-search-results" aria-expanded="false" />
            </div>
            <ul id="stop-search-results" class="stop-search-results" role="listbox"></ul>
          </div>
          <button id="nearby-stops-button" type="button" class="nearby-stops-button" aria-label="Find stops near me">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="6"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg>
            Near me
          </button>
          <p id="nearby-stops-status" class="hint" role="status" aria-live="polite" hidden></p>
          <ul id="nearby-stops-list" class="nearby-stops-list"></ul>
          <div id="saved-stops" class="commuter-favorites">
            <h3 class="commuter-subheading">Saved stops</h3>
            <ul id="favorite-stops-list" class="favorite-stops-list"></ul>
            <p id="favorite-stops-empty" class="hint">Save a selected stop from its departures panel for quick access next time.</p>
            <p id="favorites-status" class="hint" role="status" aria-live="polite" hidden></p>
          </div>
        </section>
      </div>
      <span class="map-instruction">Tap a stop to see departures</span>
    </section>

    <aside class="side-panel">
      <section id="arrivals" class="arrivals-panel" aria-label="Stop departures" hidden>
        <div class="departure-heading">
          <div>
            <p class="section-kicker">Departures from</p>
            <h2 id="arrivals-stop-name"></h2>
          </div>
          <button id="stop-clear" class="stop-clear" type="button">Clear</button>
        </div>
        <div id="arrivals-content"></div>
        <div class="departure-actions">
          <button id="favorite-toggle" type="button" class="favorite-toggle" aria-pressed="false" hidden>Save this stop</button>
        </div>
      </section>

      <section id="live-buses" class="live-buses-panel" aria-label="Live buses"></section>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
